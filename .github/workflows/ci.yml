name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build bridge
        run: pnpm --filter @dolphin/bridge build
      - name: Build CLI
        run: pnpm --filter @dolphin/cli build
      - name: Smoke-test CLI scaffolding and package configuration
        run: |
          mkdir -p /tmp/dolphin-smoke
          cd /tmp/dolphin-smoke
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" init SmokeApp --package-id com.example.smoke
          test -f SmokeApp/dolphin.config.json
          test -f SmokeApp/android/app/src/main/AndroidManifest.xml
          grep -q 'namespace = "com.example.smoke"' SmokeApp/android/app/build.gradle.kts
          grep -q 'applicationId = "com.example.smoke"' SmokeApp/android/app/build.gradle.kts
          test -f SmokeApp/android/app/src/main/java/com/example/smoke/MainActivity.kt
          grep -q '^package com.example.smoke$' SmokeApp/android/app/src/main/java/com/example/smoke/MainActivity.kt
          test -f SmokeApp/src/App.tsx
          cd SmokeApp
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" config package-id com.example.changed
          grep -q 'namespace = "com.example.changed"' android/app/build.gradle.kts
          grep -q 'applicationId = "com.example.changed"' android/app/build.gradle.kts
          test -f android/app/src/main/java/com/example/changed/MainActivity.kt
          grep -q '^package com.example.changed
      - name: Build starter app
        run: pnpm --filter dolphin-app build

  android-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android shell
        run: gradle -p packages/android-shell/template assembleDebug
 android/app/src/main/java/com/example/changed/MainActivity.kt
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" config package-id com.example.changed
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" config package-id com.example.finalized
          grep -q 'namespace = "com.example.finalized"' android/app/build.gradle.kts
          test -f android/app/src/main/java/com/example/finalized/MainActivity.kt
          grep -q '^package com.example.finalized
      - name: Build starter app
        run: pnpm --filter dolphin-app build

  android-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android shell
        run: gradle -p packages/android-shell/template assembleDebug
 android/app/src/main/java/com/example/finalized/MainActivity.kt
      - name: Build starter app
        run: pnpm --filter dolphin-app build

  android-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android shell
        run: gradle -p packages/android-shell/template assembleDebug
