name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build bridge
        run: pnpm --filter @dolphin/bridge build
      - name: Test bridge sensor API
        run: pnpm --filter @dolphin/bridge test
      - name: Build CLI
        run: pnpm --filter @dolphin/cli build
      - name: Smoke-test CLI scaffolding and package configuration
        run: |
          mkdir -p /tmp/dolphin-smoke
          cd /tmp/dolphin-smoke
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" init SmokeApp --package-id com.example.smoke
          test -f SmokeApp/dolphin.config.json
          test -f SmokeApp/android/app/src/main/AndroidManifest.xml
          grep -Fq 'namespace = "com.example.smoke"' SmokeApp/android/app/build.gradle.kts
          grep -Fq 'applicationId = "com.example.smoke"' SmokeApp/android/app/build.gradle.kts
          test -f SmokeApp/android/app/src/main/java/com/example/smoke/MainActivity.kt
          grep -Fq 'package com.example.smoke' SmokeApp/android/app/src/main/java/com/example/smoke/MainActivity.kt
          test -f SmokeApp/src/App.tsx
          ! grep -Eq 'android.permission.(CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_MEDIA_|MANAGE_EXTERNAL_STORAGE)' SmokeApp/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' SmokeApp/android/app/src/main/AndroidManifest.xml
          cd SmokeApp
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" config capability camera enable
          grep -Fq 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" config capability microphone enable
          grep -Fq 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" config capability camera disable
          ! grep -Fq 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" config capability microphone disable
          ! grep -Fq 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          cd ..
          cd SmokeApp
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" config package-id com.example.changed
          grep -Fq 'namespace = "com.example.changed"' android/app/build.gradle.kts
          grep -Fq 'applicationId = "com.example.changed"' android/app/build.gradle.kts
          test -f android/app/src/main/java/com/example/changed/MainActivity.kt
          grep -Fq 'package com.example.changed' android/app/src/main/java/com/example/changed/MainActivity.kt
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" config package-id com.example.changed
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" config package-id com.example.finalized
          grep -Fq 'namespace = "com.example.finalized"' android/app/build.gradle.kts
          test -f android/app/src/main/java/com/example/finalized/MainActivity.kt
          grep -Fq 'package com.example.finalized' android/app/src/main/java/com/example/finalized/MainActivity.kt
      - name: Build starter app
        run: pnpm --filter dolphin-app build

  android-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build Dolphin CLI
        run: pnpm --filter @dolphin/cli build
      - name: Generate voice-recorder app
        run: |
          mkdir -p /tmp/dolphin-device-test
          cd /tmp/dolphin-device-test
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" init DolphinVoiceRecorder --package-id com.dolphin.voicerecorder
          cd DolphinVoiceRecorder
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" config name "Dolphin Voice Recorder"
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" config capability microphone enable
          cd ..
      - name: Build app web assets
        run: |
          cd /tmp/dolphin-device-test/DolphinVoiceRecorder
          pnpm install
          pnpm run build
          mkdir -p android/app/src/main/assets/www
          cp -R dist/. android/app/src/main/assets/www/
      - name: Build installable Android APK
        run: gradle -p /tmp/dolphin-device-test/DolphinVoiceRecorder/android assembleDebug
      - name: Upload voice-recorder APK
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-voice-recorder-android
          path: /tmp/dolphin-device-test/DolphinVoiceRecorder/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build experimental Python playground
        run: pnpm --filter dolphin-python-playground build
      - name: Generate Dolphin Python Android app
        run: |
          mkdir -p /tmp/dolphin-python-device-test
          cd /tmp/dolphin-python-device-test
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" init DolphinPython --package-id com.dolphin.python
          cd DolphinPython
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" config name "Dolphin Python"
          rm -rf android/app/src/main/assets/www/*
          cp -R "$GITHUB_WORKSPACE/examples/python-playground/dist/." android/app/src/main/assets/www/
      - name: Build Python playground Android APK
        run: gradle -p /tmp/dolphin-python-device-test/DolphinPython/android assembleDebug
      - name: Upload Python playground APK
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-python-playground-android
          path: /tmp/dolphin-python-device-test/DolphinPython/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
